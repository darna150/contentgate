name: Live E2E QA

# Manual-only: the previous nightly schedule ran against production and wrote
# generation/approval records into the live tenant's immutable history. Live
# E2E must now name its target explicitly — point it at a Vercel Preview
# deployment or a dedicated QA environment, never production.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "ContentGate URL to test (use a Preview deployment or QA environment, not production)"
        required: true

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENTGATE_E2E_BASE_URL: ${{ github.event.inputs.base_url }}
      CONTENTGATE_E2E_EMAIL: ${{ secrets.CONTENTGATE_E2E_EMAIL }}
      CONTENTGATE_E2E_PASSWORD: ${{ secrets.CONTENTGATE_E2E_PASSWORD }}
      CONTENTGATE_E2E_ASSIGNMENT_ID: ${{ secrets.CONTENTGATE_E2E_ASSIGNMENT_ID }}
      CONTENTGATE_E2E_CONTENT_ID: ${{ secrets.CONTENTGATE_E2E_CONTENT_ID }}
      CONTENTGATE_E2E_DOCUMENT_ID: ${{ secrets.CONTENTGATE_E2E_DOCUMENT_ID }}
      CONTENTGATE_E2E_PRODUCT_ID: ${{ secrets.CONTENTGATE_E2E_PRODUCT_ID }}
      CONTENTGATE_E2E_PRODUCT_NAME: ${{ secrets.CONTENTGATE_E2E_PRODUCT_NAME }}
      CONTENTGATE_E2E_TEMPLATE_NAME: ${{ secrets.CONTENTGATE_E2E_TEMPLATE_NAME }}
      CONTENTGATE_E2E_OUTPUT_SIZE_KEY: ${{ secrets.CONTENTGATE_E2E_OUTPUT_SIZE_KEY }}
      CONTENTGATE_E2E_OUTPUT_SIZE_LABEL: ${{ secrets.CONTENTGATE_E2E_OUTPUT_SIZE_LABEL }}
      CONTENTGATE_E2E_OUTPUT_WIDTH: ${{ secrets.CONTENTGATE_E2E_OUTPUT_WIDTH }}
      CONTENTGATE_E2E_OUTPUT_HEIGHT: ${{ secrets.CONTENTGATE_E2E_OUTPUT_HEIGHT }}
      CONTENTGATE_E2E_KNOWLEDGE_QUESTION: ${{ secrets.CONTENTGATE_E2E_KNOWLEDGE_QUESTION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the stateful E2E target is not production
        run: node scripts/assert-safe-e2e-target.mjs
      - name: Require live QA credentials
        run: |
          test -n "$CONTENTGATE_E2E_EMAIL"
          test -n "$CONTENTGATE_E2E_PASSWORD"
      - name: Run live AI generation and grounded Ask validation
        run: npm run test:e2e:live-ai
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
